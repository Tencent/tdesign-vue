# 文件名建议统一为 pull-request.yml
# 应用 test-build.yml 的 demo

name: MAIN_PULL_REQUEST

on:
  pull_request:
    branches: [develop, main, feature, feat/2.7]
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_github_primary_email
        run: |
          log_emails=$(git log --pretty=format:"%ae %ce" -1)
          if [[ ${log_emails} =~ 'tdesign@tencent.com' ]];then 
            echo "$log_emails 跳过验证"
            exit 0
          fi
          if [[ ${log_emails} =~ '@tencent.com' ]];then 
            echo "默认邮箱 $log_emails 校验非法，可以去 https://github.com/settings/emails 更改" 
            exit 2;
          else 
            echo "邮箱 $log_emails 校验通过";
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: check_local_email
        run: |
          log_emails=$(git log --pretty=format:"%ae %ce" -1)
          if [[ ${log_emails} =~ 'tdesign@tencent.com' ]];then 
            echo "$log_emails 跳过验证"
            exit 0
          fi
          if [[ ${log_emails} =~ '@tencent.com' ]];then 
            echo "本地提交邮箱 $log_emails 校验非法，需要本地更改重新提交" 
            exit 2;
          else 
            echo "邮箱 $log_emails 校验通过";
          fi

  test:
    # needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: ['2.6', '2.7']
    name: test (vue ${{ matrix.vue }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 用依赖覆盖切换 Vue 版本，不运行改写源码的迁移脚本。
      - name: Apply Vue 2.7 dependency overrides
        if: matrix.vue == '2.7'
        run: node script/test/use-vue27.mjs
      - run: pnpm install

      - run: npm run lint
        if: matrix.vue == '2.6'
      # 2.7 下 demo 快照仍有若干渲染差异（JSX-in-data、timeline last 类等），
      # 先跑同一套单测；快照基线继续由 2.6 维护。
      - run: npm run test
        if: matrix.vue == '2.6'
      - run: npm run test:unit
        if: matrix.vue == '2.7'

  site:
    runs-on: ubuntu-latest
    # needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9      
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: node script/migrate/migrateConfig.mjs
      - run: pnpm install
      - run: node script/migrate/migrateComponent.mjs

      - name: Build site
        run: npm run site:preview

      - run: |
          zip -r _site.zip _site

      - name: upload _site artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site.zip
          retention-days: 5

      - name: Save PR number
        if: ${{ always() }}
        run: echo ${{ github.event.number }} > ./pr-id.txt

      - name: Upload PR number
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ./pr-id.txt

  build:
    runs-on: ubuntu-latest
    # needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9  
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: node script/migrate/migrateConfig.mjs
      - run: pnpm install
      - run: node script/migrate/migrateComponent.mjs
      - name: Build 
        run: npm run build
